<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="peaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74045F" />
      <stop offset="100%" stop-color="#4A023D" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#C7911B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C7911B" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Icon Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#peaGradient)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Lightning / Power Bolt with Gold Accent -->
  <path d="M35 12L20 34H33L29 52L44 30H31L35 12Z" 
        fill="url(#goldGradient)" 
        filter="url(#glow)" />
        
  <!-- Power Quality Pulse Dot -->
  <circle cx="46" cy="18" r="3" fill="#38BDF8" />
  <circle cx="46" cy="18" r="5" fill="none" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
</svg>
